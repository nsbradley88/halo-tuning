# Strata host setting (2026-10-09, kept after A/B with the 112 GiB pool: prompt +8-9%, output +2-8%): the IOMMU off,
# as on the Strata maintainers' gfx1151 box. The GTT pool is strix-mode's (DESKTOP_GTT_GIB=112 / INFERENCE_GTT_GIB=120).
# Trade-off: no DMA protection for USB4/Thunderbolt devices. Revert: delete this file, sudo update-grub, reboot.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT amd_iommu=off"
